version: "3.8"

# ============================================================================
# FMCG Deal Intelligence — n8n + Postgres Local Development Stack
#
# Usage:
#   docker compose up -d
#   n8n: http://localhost:5678
#   pgAdmin: http://localhost:5050 (admin@admin.com / admin)
#
# For production: replace local Postgres with Supabase and deploy n8n to
# Railway, Render, or a dedicated VPS.
# ============================================================================

services:

  # ── n8n Workflow Orchestration Engine ───────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: fmcg-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # ── Core ──────────────────────────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}

      # ── Auth (set for production) ──────────────────────────────────────────
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}

      # ── Database (uses bundled SQLite for dev; swap for Postgres in prod) ──
      - DB_TYPE=${N8N_DB_TYPE:-sqlite}
      # For Postgres: uncomment below and set DB_TYPE=postgresdb
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_N8N_PASSWORD:-n8n_secret}

      # ── Execution settings ────────────────────────────────────────────────
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336            # 14 days

      # ── Timezone ──────────────────────────────────────────────────────────
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}

      # ── App secrets ───────────────────────────────────────────────────────
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme_32_char_secret_key}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET:-changeme_jwt_secret}

      # ── FMCG Pipeline Environment Variables (used inside Code nodes) ──────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - TREND_THRESHOLD=${TREND_THRESHOLD:-3}
      - N8N_WEBHOOK_BASE_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}

      # ── Email (optional, for newsletter delivery) ─────────────────────────
      - N8N_EMAIL_MODE=${N8N_EMAIL_MODE:-smtp}
      - N8N_SMTP_HOST=${SMTP_HOST:-}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USER:-}
      - N8N_SMTP_PASS=${SMTP_PASS:-}
      - N8N_SMTP_SENDER=${SMTP_FROM:-fmcg-intel@yourdomain.com}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows-import:ro    # auto-import on startup
    networks:
      - fmcg_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL (n8n backend for production-grade persistence) ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: fmcg-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_N8N_PASSWORD:-n8n_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fmcg_network
    profiles:
      - postgres     # only started with: docker compose --profile postgres up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB GUI) ──────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fmcg-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fmcg_network
    profiles:
      - tools          # only started with: docker compose --profile tools up
    depends_on:
      - postgres

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  fmcg_network:
    driver: bridge
